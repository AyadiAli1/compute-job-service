version: v2
clean: true                      # löscht gen/ vor jeder Generierung (keine Altlasten)
managed:
  enabled: true                  # setzt go_package automatisch, nicht in der .proto
  override:
    - file_option: go_package_prefix
      value: github.com/AyadiAli1/compute-job-service/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi    # Typ-Hinweise für die IDE
    out: gen/python
  - remote: buf.build/grpc/python
    out: gen/python
inputs:
  - directory: api/proto
